# Local services for Loady on the development VM.
#
# This file is this repository's own, not an override layered on loady-one/backend/compose.yaml.
# It has to be, because two of the Linux-only fixes live in it (extra_hosts and the explicit
# loopback bindings) and loady-one is read-only to this setup. The cost is drift: when the team
# changes their compose file, this one does not follow, so ld-reset diffs the two and warns.
#
# The services are the same five the macOS file starts. What is different, and why:
#
#   extra_hosts on apim   loady-one/backend/nginx.conf proxies to host.docker.internal, a name
#                         Docker Desktop invents and Docker Engine on Linux does not have. Without
#                         this line nginx fails to resolve it and every /app call is a 502. The
#                         nginx.conf itself is mounted read-only straight from the checkout, so the
#                         team's routing changes are picked up with nothing to maintain here.
#                         The matching half of this fix is in bootstrap.sh: ufw allows the bridge
#                         network back in to the function-host ports, which a default deny blocks.
#
#   127.0.0.1 bindings    the daemon is configured with "ip": "127.0.0.1" so this is belt and
#                         braces, but it keeps the file correct on a machine where that config has
#                         not been applied. Nothing here is ever reachable from the LAN; the Mac
#                         reaches it through Rider or SSH forwarding.
#
#   healthchecks          ld-start waits for readiness instead of sleeping. SQL Server can check
#                         itself because the image carries sqlcmd. The Cosmos emulator cannot be
#                         trusted to carry curl, so ld-start probes it from the host instead.
#
# LOADY_REPO_DIR is exported by ld_compose in scripts/lib.sh and points at the checkout or worktree
# the command is running in.

name: loady

services:
  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    restart: unless-stopped
    command: azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - '127.0.0.1:10000:10000'
      - '127.0.0.1:10001:10001'
      - '127.0.0.1:10002:10002'
    volumes:
      - azurite_data:/data

  apim:
    image: nginx
    container_name: apim
    restart: unless-stopped
    ports:
      - '127.0.0.1:7000:80'
    volumes:
      # Read-only, and from the checkout: the team owns this routing, we only host it.
      - ${LOADY_REPO_DIR:?set by ld_compose in scripts/lib.sh}/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Passw0rd!
      - MSSQL_TLS=Optional
    ports:
      - '127.0.0.1:1433:1433'
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      # The tools path moved between image generations; try the current one, then the old one.
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # PROTOCOL: https is what the backend expects, and the emulator issues its own certificate for it
  # into the data volume — so the certificate is new after every ld-reset. Nothing on Linux trusts
  # it by default; scripts/cosmos-cert.sh installs it into the system trust store and ld-start runs
  # that on every start. docs/remote-development.md has the reasoning.
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: cosmosdb
    restart: unless-stopped
    environment:
      PROTOCOL: https
      DATA_PATH: /data
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    ports:
      - '127.0.0.1:8081:8081'
      - '127.0.0.1:1234:1234'
    volumes:
      - cosmosdb_data:/data
    entrypoint: ['/bin/bash', '-c']
    # Carried over from the macOS file: the emulator's embedded PostgreSQL refuses to start again
    # after an unclean stop unless its lock files are cleared first.
    command:
      - >-
        rm -f /data/db/postmaster.pid /data/db/postgresql.auto.conf.lock /data/db/postmaster.opts 2>/dev/null || true
        && exec /home/cosmosdev/docker_entrypoint.sh

volumes:
  redis_data: {}
  azurite_data: {}
  sql_data: {}
  cosmosdb_data: {}
